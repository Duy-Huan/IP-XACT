# Single Unified Multi-Platform Heterogeneous SoC mapped over a SystemC/TLM-2.0 2x2 Mesh NoC.
# Supports hybrid fidelity: real Verilator-compiled SystemVerilog RTL (mac_npu_rtl.sv) co-simulating
# live alongside SystemC/TLM-2.0 behavioral models and a 2nd-master DMA engine on ONE 2x2 NoC.
schema_version: unified-systemc-soc-1
name: Unified_Hetero_MultiPlatform_SoC
noc:
  topology: mesh-2x2
  rows: 2
  cols: 2
  hop_latency_ns: 10
  link_latency_ns: 5
  cpu_router: [0, 0]
cpu:
  name: unified_rv64_core
  isa: rv64im_zicsr
  privilege: M
  pmp_regions: 4
  clock_hz: 50000000
  timebase_hz: 10000000
  entry: 0x80000000
  stack_top: 0x800F0000
  protected_scratch: 0x80100000
  protected_size: 0x1000
  dma_src_buf: 0x80110000
  dma_dst_buf: 0x80120000
  model_disclosure: >-
    SystemC/TLM-2.0 RV64IM_Zicsr functional initiator with real M-mode PMP CSRs, trap controller,
    and GDB RSP debug stub; co-simulates live with Verilator-compiled SystemVerilog mac_npu_rtl.sv
    and a 2nd-master NoC DMA engine.
devices:
- name: boot_rom
  platform: qemu-io
  model: rom
  backend: systemc-tlm
  base: 0x00001000
  size: 0x00001000
  router: [0, 0]
- name: sim_finisher
  platform: qemu-io
  model: finisher
  backend: systemc-tlm
  base: 0x00100000
  size: 0x00001000
  router: [0, 0]
- name: main_dram
  platform: qemu-io
  model: ram
  backend: systemc-tlm
  base: 0x80000000
  size: 0x01000000
  router: [0, 0]
- name: sys_clint
  platform: qemu-io
  model: clint
  backend: systemc-tlm
  base: 0x02000000
  size: 0x00010000
  router: [1, 0]
- name: sys_plic
  platform: qemu-io
  model: plic
  backend: systemc-tlm
  base: 0x0C000000
  size: 0x04000000
  router: [1, 0]
- name: qemu_uart_0
  platform: qemu-io
  model: uart
  backend: systemc-tlm
  base: 0x11000000
  size: 0x00001000
  irq: 10
  router: [1, 0]
- name: chipyard_gcd_0
  platform: chipyard
  model: chipyard.gcd
  backend: systemc-tlm
  base: 0x13000000
  size: 0x00001000
  irq: 12
  router: [0, 1]
- name: opentitan_gpio_0
  platform: opentitan
  model: opentitan.gpio
  backend: systemc-tlm
  base: 0x14000000
  size: 0x00001000
  irq: 13
  router: [0, 1]
- name: dma_engine_0
  platform: systemc-dma
  model: user.dma_engine
  backend: systemc-tlm
  base: 0x17000000
  size: 0x00001000
  irq: 14
  router: [0, 1]
  disclosure: Second TLM-2.0 bus master initiating real memory transfers across the 2x2 NoC.
- name: mac_npu_0
  platform: systemc-npu
  model: user.mac_npu
  backend: verilator-rtl
  base: 0x15000000
  size: 0x00001000
  irq: 20
  router: [1, 1]
  disclosure: Verilator-compiled SystemVerilog RTL (mac_npu_rtl.sv), distinct from Chipyard Gemmini.
- name: pmp_guard_0
  platform: systemc-pmp
  model: user.pmp_guard
  backend: systemc-tlm
  base: 0x16000000
  size: 0x00001000
  irq: 21
  router: [1, 1]
  disclosure: Original SystemC/TLM-2.0 NoC IOPMP bus firewall enforcing write protection for both CPU and DMA masters.
