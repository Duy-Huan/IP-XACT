# Chipyard GCD + OpenTitan GPIO + QEMU UART/CLINT/PLIC/RAM/ROM/Finisher.
# NOTE: user.mac_npu is an original synthetic MMIO32 SystemC MAC model, NOT upstream Chipyard Gemmini.
