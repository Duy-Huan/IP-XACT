# Native generator acceptance configuration; distinct from the 46-instance target.
schema_version: '1'
name: AI_SOC_native
cpu: {name: application_core, model: qemu.rv64, gem5_model: gem5.RiscvTimingSimpleCPU, timebase_hz: 10000000}
boot: {ram: main_sram, rom: boot_code, console: debug_console, entry: 0x80000000}
devices:
  - {name: main_sram, model: ram, base: 0x80000000, size: 0x1000000}
  - {name: scratch_sram, model: ram, base: 0x90000000, size: 0x10000}
  - {name: boot_code, model: rom, base: 0x1000, size: 0x1000}
  - {name: timer_controller, model: clint, base: 0x2000000, size: 0x10000}
  - {name: interrupt_controller, model: plic, base: 0xc000000, size: 0x4000000}
  - {name: simulation_exit, model: finisher, base: 0x100000, size: 0x1000}
  - {name: debug_console, model: uart, base: 0x11000000, size: 0x100, irq: 10}
  - {name: service_console, model: uart, base: 0x11001000, size: 0x100, irq: 11}
  - {name: accelerator_a, model: chipyard.gcd, base: 0x13000000, size: 0x1000, irq: 12}
  - {name: accelerator_b, model: chipyard.gcd, base: 0x13001000, size: 0x1000, irq: 14}
  - {name: control_gpio, model: opentitan.gpio, base: 0x14000000, size: 0x1000, irq: 13}
  - {name: status_gpio, model: opentitan.gpio, base: 0x14001000, size: 0x1000, irq: 15}
