name: Podman SDK and OCI release

on:
  push:
    branches: [dev, main]
    tags: ['container-v*']
    paths: ['Containerfile', '.containerignore', '.dockerignore', 'containers/**', 'scripts/podman.sh', 'tests/test_container.py', '.github/workflows/container-release.yml']
  pull_request:
    paths: ['Containerfile', '.containerignore', '.dockerignore', 'containers/**', 'scripts/podman.sh', 'tests/test_container.py', '.github/workflows/container-release.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install rootless Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs
          podman info
      - name: Build and run actual offline native smoke
        run: |
          mkdir -p build/container-release
          bash scripts/podman.sh build
          bash scripts/podman.sh smoke | tee build/container-release/smoke.log
      - name: Export and load OCI archive
        run: |
          bash scripts/podman.sh export build/container-release
          podman load --input build/container-release/socsim-sdk-0.3.0a5-r1-linux-amd64.oci.tar
          bash scripts/podman.sh smoke | tee build/container-release/loaded-smoke.log
          (cd build/container-release && sha256sum smoke.log loaded-smoke.log >> SHA256SUMS)
      - name: Publish container prerelease from a main commit
        if: startsWith(github.ref, 'refs/tags/container-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = container-v0.3.0a5-r1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          cat > build/container-release/NOTES.md <<'EOF'
          Podman rootless HW/SW Emulator & QA SDK for 0.3.0a5, container packaging revision r1 (Linux amd64).

          Contains the pinned Python 3.12 environment, reference QEMU 10.0.13, RISC-V
          toolchains, SystemC 3.0.1, Verilator 5.032, Yosys 0.52, ShellCheck, Java 21
          and the CHIA-style Emulator SDK (`socsim.sdk`) + QA runner (`usp qa`).
          Offline acceptance compiles real firmware, tests guest success/failure/timeout,
          runs unseen-design QA (`Helios_QA_SoC`) and verifies scorecards and upgrade audit.

          Verify SHA256SUMS, then podman load --input socsim-sdk-0.3.0a5-r1-linux-amd64.oci.tar.
          See docs/podman.md and docs/qa-emulator-sdk.md.
          EOF
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
            --title 'Podman Emulator SDK 0.3.0a5-r1' --notes-file build/container-release/NOTES.md \
            build/container-release/*.oci.tar build/container-release/SHA256SUMS \
            build/container-release/image-inspect.json build/container-release/smoke.log \
            build/container-release/loaded-smoke.log
      - name: Retain smoke logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: podman-sdk-smoke
          path: build/container-release/*.log
          if-no-files-found: ignore
