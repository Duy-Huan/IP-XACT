name: OpenROAD reference implementation

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  rtl-to-gds:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install frozen Python environment
        run: |
          python3 -m venv .ci-uv
          .ci-uv/bin/pip install uv==0.13.5
          .ci-uv/bin/uv sync --frozen --extra dev
      - name: Prepare immutable local OpenROAD tools
        run: bash scripts/setup_openroad.sh
      - name: Implement original public RTL fixture and verify layout evidence
        run: |
          .venv/bin/usp asic build --toolchain build/openroad-tools \
            --rtl tests/rtl/physical_counter.sv --top usp_physical_counter \
            --sdc tests/rtl/physical_counter.sdc --out build/physical-counter
          .venv/bin/usp asic verify build/physical-counter
      - name: Upload public-fixture summary only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: openroad-reference-summary
          path: |
            build/physical-counter/report.json
            build/physical-counter/report.md
          if-no-files-found: ignore
          retention-days: 7
