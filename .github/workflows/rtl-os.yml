name: RTOS on instruction-owning RTL CPUs

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  rtl-os:
    runs-on: [self-hosted, linux, x64, soc-eda]
    timeout-minutes: 60
    env:
      USP_TOOLCHAIN_ENV: ${{ vars.USP_TOOLCHAIN_ENV }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Build real kernels and execute both CPU and engine matrices
        run: |
          test -n "$USP_TOOLCHAIN_ENV"
          # shellcheck source=/dev/null
          source "$USP_TOOLCHAIN_ENV"
          uv sync --frozen --extra dev --extra bringup --extra models
          source .venv/bin/activate
          export USP_RTL_OS_ROOT="$PWD/build/rtl-os-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export USP_UCOS_ROOT="$PWD/build/ucos-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export USP_RTL_ZEPHYR_ROOT="$PWD/build/rtl-zephyr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash scripts/rtl_os_bringup.sh
          bash scripts/rtl_zephyr_bringup.sh
          USP_REQUIRE_RTL_PLATFORM=1 python -m pytest tests/test_rtl_platform.py -v --junitxml=build/rtl-platform-junit.xml
      - name: Upload synthetic JUnit only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: rtl-os-junit
          path: |
            build/rtl-os-junit.xml
            build/rtl-zephyr-junit.xml
            build/rtl-platform-junit.xml
          if-no-files-found: ignore
          retention-days: 7
