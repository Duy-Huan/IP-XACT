name: SoC regression

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Require same-repository dev promotion into main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          SOURCE: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: test "$SOURCE" = dev && test "$SAME_REPO" = true

  regression:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 15
    steps:
      - name: Install pinned reference runtime and compiler
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-venv \
            qemu-system-riscv=1:10.0.13+ds-0+deb13u1 \
            qemu-system-data=1:10.0.13+ds-0+deb13u1 \
            gcc-riscv64-unknown-elf=14.2.0+19 binutils-riscv64-unknown-elf=2.44-3+7+b1
          python3 -m venv /opt/ci-uv
          /opt/ci-uv/bin/pip install uv==0.13.5
          echo /opt/ci-uv/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Frozen setup and required regression
        run: |
          bash scripts/setup.sh
          bash scripts/regression.sh
      - name: Upload synthetic test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regression-junit
          path: build/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  custom-zephyr:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 45
    steps:
      - name: Install source-build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-venv \
            gcc g++ make pkg-config libglib2.0-dev libpixman-1-dev zlib1g-dev libfdt-dev \
            device-tree-compiler flex bison bc m4 libsystemc-dev verilator \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu gcc-riscv64-unknown-elf=14.2.0+19 \
            binutils-riscv64-unknown-elf=2.44-3+7+b1
          apt-get install -y --no-install-recommends curl openjdk-21-jdk-headless
          python3 -m venv /opt/ci-uv
          /opt/ci-uv/bin/pip install uv==0.13.5
          echo /opt/ci-uv/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Acquire pinned public sources and build exact generated machine/BSP
        env:
          CROSS_COMPILE: riscv64-unknown-elf-
          USP_JOBS: '2'
          USP_FETCH_LINUX: '1'
          USP_FETCH_MODELS: '1'
          USP_FETCH_FREERTOS: '1'
          USP_FETCH_CHIPYARD: '1'
          CROSS_COMPILE_LINUX: riscv64-linux-gnu-
        run: |
          uv python install 3.12.14
          uv sync --frozen --python 3.12.14 --extra dev --extra bringup
          bash scripts/fetch_upstreams.sh
          bash scripts/bringup.sh
          bash scripts/freertos_bringup.sh
          bash scripts/linux_bringup.sh
          bash scripts/hybrid_bringup.sh
          bash scripts/setup_chipyard_tools.sh
          bash scripts/source_ips_bringup.sh
          bash scripts/hierarchy_bringup.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: custom-zephyr-junit
          path: |
            build/custom-junit.xml
            build/linux-junit.xml
            build/hybrid-junit.xml
            build/freertos-junit.xml
            build/source-ips-junit.xml
          if-no-files-found: ignore
          retention-days: 7

  gem5-se:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 240
    steps:
      - name: Install full acceptance source-build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-venv \
            gcc g++ make pkg-config libglib2.0-dev libpixman-1-dev zlib1g-dev libfdt-dev \
            device-tree-compiler flex bison bc m4 gcc-riscv64-linux-gnu \
            libsystemc-dev verilator curl openjdk-21-jdk-headless yosys=0.52-2 yosys-abc=0.52-2 \
            binutils-riscv64-linux-gnu gcc-riscv64-unknown-elf=14.2.0+19 \
            binutils-riscv64-unknown-elf=2.44-3+7+b1
          python3 -m venv /opt/ci-uv
          /opt/ci-uv/bin/pip install uv==0.13.5
          echo /opt/ci-uv/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and compare the full supported acceptance matrix
        env:
          CROSS_COMPILE: riscv64-unknown-elf-
          CROSS_COMPILE_LINUX: riscv64-linux-gnu-
          USP_FETCH_LINUX: '1'
          USP_FETCH_MODELS: '1'
          USP_JOBS: '2'
          USP_FETCH_CHIPYARD: '1'
          USP_FETCH_FREERTOS: '1'
        run: |
          uv python install 3.12.14
          uv sync --frozen --python 3.12.14 --extra dev --extra bringup --extra models
          bash scripts/fetch_upstreams.sh
          bash scripts/bringup.sh
          bash scripts/linux_bringup.sh
          bash scripts/gem5_bringup.sh
          bash scripts/freertos_bringup.sh
          bash scripts/hybrid_bringup.sh
          bash scripts/setup_chipyard_tools.sh
          bash scripts/source_ips_bringup.sh
          bash scripts/hierarchy_bringup.sh
          bash scripts/dual_soc_bringup.sh
          USP_IP_MODELS_DIR="$PWD/build/source-ip-models" bash scripts/native_soc_bringup.sh
          bash scripts/rtl_cpu_bringup.sh
          USP_REQUIRE_WORKSPACE=1 .venv/bin/python -m pytest tests/test_workspace.py -v --junitxml=build/workspace-junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gem5-se-junit
          path: |
            build/gem5-junit.xml
            build/workspace-junit.xml
            build/dual-soc-junit.xml
            build/native-soc/junit.xml
            build/rtl-cpu-junit.xml
          if-no-files-found: ignore
          retention-days: 7
