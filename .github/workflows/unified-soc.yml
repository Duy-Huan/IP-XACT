name: Unified QEMU gem5 SystemC SoC

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unified-soc:
    # Trusted provisioned runner; activation supplies matching pinned source and
    # native QEMU/Zephyr/SystemC model artifacts for all three public profiles.
    runs-on: [self-hosted, linux, x64, soc-eda]
    timeout-minutes: 90
    env:
      USP_TOOLCHAIN_ENV: ${{ vars.USP_TOOLCHAIN_ENV }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Build out-of-tree gem5 bridge and execute both CPU engines
        run: |
          test -n "$USP_TOOLCHAIN_ENV"
          # shellcheck source=/dev/null
          source "$USP_TOOLCHAIN_ENV"
          uv sync --frozen --extra dev --extra bringup --extra models
          source .venv/bin/activate
          : "${USP_GEM5_SOURCE:?Provide the pinned clean gem5 checkout}"
          export USP_UNIFIED_GEM5_BUILD="$PWD/build/unified-gem5-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          usp unified build-gem5 --source "$USP_GEM5_SOURCE" --out "$USP_UNIFIED_GEM5_BUILD" --jobs 2
          export USP_REQUIRE_UNIFIED=1 USP_REQUIRE_LIVE_GARNET=1
          python -m pytest tests/test_unified.py tests/test_live_fabric.py -v --junitxml=build/unified-junit.xml
      - name: Build native coherent DMA engine and test the three mapped designs
        run: |
          # shellcheck source=/dev/null
          source "$USP_TOOLCHAIN_ENV"
          source .venv/bin/activate
          export USP_COHERENT_BUILD="$PWD/build/coherent-gem5-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          usp coherent build-engine --source "$USP_GEM5_SOURCE" --out "$USP_COHERENT_BUILD" --jobs 2
          USP_REQUIRE_COHERENT=1 python -m pytest tests/test_coherent.py -v --junitxml=build/coherent-junit.xml
      - name: Upload synthetic regression results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: unified-soc-junit
          path: |
            build/unified-junit.xml
            build/coherent-junit.xml
          if-no-files-found: ignore
          retention-days: 7
